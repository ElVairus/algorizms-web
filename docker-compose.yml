version: '3.8'

services:
  algorizms-web:
    build: .
    container_name: algorizms-production-web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - VIRTUAL_HOST=algorizms.com,www.algorizms.com
      - LETSENCRYPT_HOST=algorizms.com,www.algorizms.com
      - LETSENCRYPT_EMAIL=cmo@algorizms.com
